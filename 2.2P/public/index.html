<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIT725 Task 2.2P</title>
  </head>
  <body>
    <h1>SIT725 Express Calculator</h1>
    <p>Add two numbers using a Node.js Express server.</p>

    <form id="calculator-form">
      <label for="num1">First number:</label>
      <input type="number" id="num1" step="any" required />

      <label for="num2">Second number:</label>
      <input type="number" id="num2" step="any" required />

      <button type="submit">Add Numbers</button>
    </form>

    <p id="result"></p>

    <script>
      const form = document.getElementById("calculator-form");
      const result = document.getElementById("result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const a = document.getElementById("num1").value;
        const b = document.getElementById("num2").value;

        try {
          const response = await fetch(
            `/add?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`,
          );

          const data = await response.json();

          if (!response.ok) {
            result.textContent = data.error;
            return;
          }

          result.textContent = `Result: ${data.result}`;
        } catch (error) {
          result.textContent = "Unable to connect to the server.";
        }
      });
    </script>
  </body>
</html>
